      više informacija.
  otbr_log_level:
    name: Nivo evidencije OpenThread Border Router agenta
    description: >-
      Podešava nivo beleženja događaja za OpenThread Border Router agenta (otbr-agent).
  firewall:
    name: OTBR zaštitni zid
    description: >-
      Koristi OpenThread Border Router zaštitni zid za blokiranje nepotrebnog saobraćaja.
  nat64:
    name: NAT64
    description: >-
      Omogućava prevođenje mrežnih adresa sa IPv6 na IPv4. Ovo omogućava Thread
      uređajima da komuniciraju sa uređajima na internetu.
  beta:
    name: Beta
    description: >-
      Omogućava beta režim za pokretanje novije, eksperimentalne verzije OpenThread
      Border Router-a.
network:
  8080/tcp: OpenThread veb port
  8081/tcp: OpenThread REST API port
