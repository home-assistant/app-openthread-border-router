---
configuration:
  device:
    name: Uređaj
    description: Serijski port na koji je povezan OpenThread RCP radio.
  baudrate:
    name: Brzina prenosa
    description: >-
      Brzina prenosa serijskog porta koja se koristi za komunikaciju sa Silicon Labs radijom.
  flow_control:
    name: Hardverska kontrola toka
    description: Omogućava hardversku kontrolu toka za serijski port.
  backbone_interface:
    name: Mrežni interfejs okosnice
    description: >-
      Mrežni interfejs koji se koristi za mrežu okosnice.
      Ako nije naveden, koristi se primarni interfejs.
  network_device:
    name: Mrežni uređaj
    description: >-
      <host:port> prilikom povezivanja sa uređajem putem soketa (ima prednost
